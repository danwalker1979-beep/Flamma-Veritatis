<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Companion</title>
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <div class="app">
      <header class="topbar">
        <div class="avatar" id="avatar">🙂</div>
        <div class="who">
          <div class="name" id="name">…</div>
          <div class="status">
            <span id="moodLabel">neutral</span>
            <span class="dot">·</span>
            <span id="readLabel"></span>
          </div>
        </div>
        <div class="rapport">
          <div class="rapport-label">rapport <span id="rapportNum">10</span></div>
          <div class="meter"><div class="meter-fill" id="meterFill"></div></div>
        </div>
        <button id="voiceToggle" class="voice-toggle" title="Toggle voice" aria-pressed="true">🔊</button>
        <button id="settingsToggle" class="voice-toggle" title="Settings" aria-pressed="false">⚙️</button>
      </header>

      <section class="settings" id="settings" hidden>
        <div class="setting">
          <div class="setting-label">Temperament <span class="hint">where she starts</span></div>
          <div class="segmented" id="temperamentRow"></div>
        </div>
        <div class="setting">
          <div class="setting-label">When you push a boundary</div>
          <div class="segmented" id="deflectionRow"></div>
        </div>
        <div class="setting">
          <div class="setting-label">Work / background</div>
          <input id="occupation" class="field" type="text" placeholder="e.g. blue-collar mechanic, ER nurse, grad student…" />
        </div>
        <div class="setting">
          <div class="setting-label">Education <span class="hint">shapes how she talks</span></div>
          <select id="education" class="field"></select>
        </div>
        <div class="setting">
          <div class="setting-label">Passions / interests</div>
          <input id="interests" class="field" type="text" placeholder="e.g. equestrianism, philosophy, theology…" />
        </div>
        <div class="setting">
          <div class="setting-label">Politics <span class="hint">a trait, not a lecture</span></div>
          <select id="politics" class="field"></select>
          <input id="politicsNote" class="field field-sub" type="text" placeholder="optional nuance — specific stances she holds" />
        </div>
        <div class="setting">
          <div class="setting-label">Accent <span class="hint">how she sounds</span></div>
          <select id="accent" class="field"></select>
        </div>
        <div class="setting">
          <div class="setting-label">Vernacular <span class="hint">the words she reaches for</span></div>
          <select id="vernacular" class="field"></select>
        </div>
      </section>

      <main class="messages" id="messages"></main>

      <form class="composer" id="composer">
        <input
          id="input"
          type="text"
          autocomplete="off"
          placeholder="Say something…"
        />
        <button type="submit" id="send">Send</button>
      </form>
    </div>
    <script src="./app.js"></script>
  </body>
</html>
